name: .NET Desktop

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    # Install the .NET workload
    - name: Install .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Setup Windows SDK
      uses: GuillaumeFalourd/setup-windows10-sdk-action@v1.11
      with:
        sdk-version: 18362

    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Use Nerdbank.GitVersioning to set version variables
      uses: dotnet/nbgv@master
      id: nbgv

    # Restore the application
    - name: Restore the application
      run: dotnet restore wintabs.GUI/wintabs.GUI.csproj
      env:
        Configuration: ${{ matrix.configuration }}

    # Build the application
    - name: Build the application
      run: dotnet build --no-restore --property WarningLevel=0 wintabs.GUI
      env:
        Configuration: ${{ matrix.configuration }}

    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: |
        dotnet test wintabs.Tests
        dotnet test wintabs.Layouts.Tests

    - name: Generate archive
      run: |
        Compress-Archive -Path wintabs.GUI/bin/${{ matrix.configuration }}/net10.0-windows10.0.18362.0/* -DestinationPath wintabs.${{ matrix.configuration }}.x64.zip
        (Get-FileHash wintabs.${{ matrix.configuration }}.x64.zip -Algorithm SHA256).Hash | Out-File wintabs.${{ matrix.configuration }}.x64.zip.sha256sum

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        prerelease: true
        files: |
          wintabs.${{ matrix.configuration }}.x64.zip
          wintabs.${{ matrix.configuration }}.x64.zip.sha256sum
