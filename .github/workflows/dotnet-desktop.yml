name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Test
      run: |
        dotnet test wintabs.Tests
        dotnet test wintabs.Layouts.Tests

    # A v1.2.3 tag builds version 1.2.3; other builds use the version in Directory.Build.props.
    - name: Build installer
      shell: pwsh
      run: |
        $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '' }
        ./installer/build.ps1 -Version $version

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: WinTabs-setup
        path: artifacts/WinTabs-*-setup.exe

    - name: Release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/WinTabs-*-setup.exe
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
